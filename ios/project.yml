name: Mooberball
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mooberball:
    type: application
    platform: iOS
    sources:
      - Mooberball
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooberball.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mooberball
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo for your Mooberball profile.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  MooberballTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MooberballTests
    dependencies:
      - target: Mooberball
schemes:
  Mooberball:
    build:
      targets:
        Mooberball: all
    test:
      targets:
        - MooberballTests
